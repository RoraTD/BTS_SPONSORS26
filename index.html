<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BTS Sponsors 2026</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
}

#billboard {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}

.slide {
    position: absolute;
    width: 100%;
    height: 100%;
    inset: 0;

    object-fit: contain;

    opacity: 0;
    transition: opacity 1.2s ease-in-out;
}

.slide.active {
    opacity: 1;
}
</style>
</head>

<body>

<div id="billboard"></div>

<script>

const sponsors = [
    "ADRA_DESIGNS.png",
    "AFFORDABLE_HOMES.png",
    "AUS_CHOPPERS.png"
    "BADCOMPNAY.jpg"
    "BATTI_BRAND.png"
    "BORKAN.jpg"
    "BaDDecO.jpg"
    "BadAppleInteriors.jpg"
    "BadAppleProps.jpg"
    "Bloomingdeals.png"
    "BsThreads.jpg"
    "CARO.png"
    "CASTLE_FASHIONS.jpg" 
    "CETI.png"
    "CETI_CUSTOMS.jpeg"
    "CRAZY.jpg"
    "CRYSTAL_KITSUNE.png"
    "Cinnamon_Designs.jpg"
    "Custom_Creations.png"
    "DEL_MAL.png" 
    "DESIGNS_LADYO.png"
    "DGMC_LOGO.png"
    "DLMC_LOGO.jpg"
    "DOLLY_DESIGN.png"
    "DejavuDesigns.png"
    "Donnah_Designs.png"
    "EMPORIO.png"
    "EVERYTHING_WEDDING.png"
    "FallenDeco.jpg"
    "FallenDeco_FallenDecoProps.jpg"
    "FallenDeco_GetARoom.jpg"
    "FallenDeco_MysticGardens.jpg"
    "Foggy_Soul.png
    "GRAFI_DESIGNS.jpg"
    "Good Girl Graphics.png"
    "HONEY_DESIGN.png"
    "JB_DESIGNS.jpeg"
    "JB_LAYOUT.jpeg"
    "JustBottles_Taz_Tazman221.jpg"
    "KITTI_KAT.jpg"
    "LLMC LOGO.png"
    "LPMC.png"
    
];

const billboard = document.getElementById("billboard");

sponsors.forEach((image, index) => {

    const slide = document.createElement("img");

    slide.src = image;
    slide.className = "slide";

    if (index === 0) {
        slide.classList.add("active");
    }

    billboard.appendChild(slide);
});

const slides = document.querySelectorAll(".slide");

let current = 0;

if (slides.length > 1) {

    setInterval(() => {

        slides[current].classList.remove("active");

        current = (current + 1) % slides.length;

        slides[current].classList.add("active");

    }, 8000);
}

</script>

</body>
</html>
