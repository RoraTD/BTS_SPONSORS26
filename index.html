<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BTS Sponsors 2026</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
}

#billboard {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}

.slide {
    position: absolute;
    width: 100%;
    height: 100%;
    inset: 0;

    object-fit: contain;

    opacity: 0;
    transition: opacity 1.2s ease-in-out;
}

.slide.active {
    opacity: 1;
}
</style>
</head>

<body>

<div id="billboard"></div>

<script>

const sponsors = [
    "images/sponsor1.png",
    "images/sponsor2.png",
    "images/sponsor3.png"
];

const billboard = document.getElementById("billboard");

sponsors.forEach((image, index) => {

    const slide = document.createElement("img");

    slide.src = image;
    slide.className = "slide";

    if (index === 0) {
        slide.classList.add("active");
    }

    billboard.appendChild(slide);
});

const slides = document.querySelectorAll(".slide");

let current = 0;

if (slides.length > 1) {

    setInterval(() => {

        slides[current].classList.remove("active");

        current = (current + 1) % slides.length;

        slides[current].classList.add("active");

    }, 8000);
}

</script>

</body>
</html>
